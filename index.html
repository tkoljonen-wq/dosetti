<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dosetti</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dosetti">
  <meta name="theme-color" content="#0f0f1a">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --bg:      #0f0f1a;
      --surface: #1a1a2e;
      --border:  rgba(78,195,255,0.15);
      --text:    #e8eaf0;
      --muted:   #7a8099;
      --accent:  #4ec3ff;
      --red:     #ff4b6e;
      --green:   #00d68f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 15%, rgba(78,195,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 30%, rgba(78,195,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 70%, rgba(78,195,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 65%, rgba(78,195,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 85%, rgba(78,195,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 90%, rgba(78,195,255,0.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 65% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,0.2) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(78,195,255,0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(78,195,255,0.05),
        0 24px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .pill-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #e8eaf0 0%, #4ec3ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .date-display {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .day-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 2rem;
    }

    .dose-btn {
      position: relative;
      width: 100%;
      padding: 1.1rem 1.5rem;
      border: none;
      border-radius: 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.25s ease;
      overflow: hidden;
      outline: none;
    }

    .dose-btn:active { transform: scale(0.97); }

    .dose-btn.not-taken {
      background: linear-gradient(135deg, #ff4b6e, #c0213f);
      color: #fff;
      animation: btn-pulse 2.5s ease-in-out infinite;
    }

    @keyframes btn-pulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(255,75,110,0.45), 0 2px 8px rgba(0,0,0,0.3); }
      50%       { box-shadow: 0 8px 52px rgba(255,75,110,0.75), 0 2px 8px rgba(0,0,0,0.3); }
    }

    .dose-btn.not-taken:hover { transform: translateY(-1px); }

    .dose-btn.taken {
      background: linear-gradient(135deg, #00d68f, #00a86b);
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,214,143,0.4), 0 2px 8px rgba(0,0,0,0.3);
      cursor: default;
      animation: none;
    }

    .btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .btn-icon { font-size: 1.3rem; line-height: 1; }

    .status-row {
      margin-top: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      transition: background 0.4s, box-shadow 0.4s;
    }

    .status-dot.not-taken { background: var(--red);   box-shadow: 0 0 6px var(--red); }
    .status-dot.taken     { background: var(--green); box-shadow: 0 0 6px var(--green); }

    .time-taken {
      margin-top: 0.7rem;
      font-size: 0.78rem;
      color: var(--green);
      min-height: 1.1em;
    }

    .streak {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .streak-label {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .streak-value {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      line-height: 1;
      color: var(--accent);
    }

    .streak-unit {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="card">
  <svg class="pill-icon" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="36" cy="36" rx="24" ry="14" fill="rgba(78,195,255,0.1)"/>
    <rect x="12" y="29" width="48" height="14" rx="7" fill="#4ec3ff"/>
    <rect x="12" y="29" width="24" height="14" rx="7" fill="#1e7ebf"/>
    <circle cx="25" cy="24" r="2.5" fill="#4ec3ff" opacity="0.5"/>
    <circle cx="47" cy="48" r="2.5" fill="#4ec3ff" opacity="0.5"/>
    <circle cx="54" cy="26" r="1.5" fill="#4ec3ff" opacity="0.35"/>
  </svg>

  <h1>Dosetti</h1>
  <div class="subtitle">Päivittäinen lääkemuistutus</div>

  <div class="date-display" id="dateDisplay"></div>
  <div class="day-name" id="dayName"></div>

  <button class="dose-btn not-taken" id="doseBtn" onclick="takeDose()">
    <div class="btn-inner">
      <span class="btn-icon" id="btnIcon">💊</span>
      <span id="btnText">Merkitse otetuksi</span>
    </div>
  </button>

  <div class="time-taken" id="timeTaken">&nbsp;</div>

  <div class="status-row">
    <div class="status-dot not-taken" id="statusDot"></div>
    <span id="statusText">Lääke ottamatta tänään</span>
  </div>

  <div class="streak">
    <div class="streak-label">Peräkkäinen putki</div>
    <div class="streak-value" id="streakValue">0</div>
    <div class="streak-unit">päivää peräkkäin</div>
  </div>
</div>

<script>
// ── Storage ───────────────────────────────────────────────────────────────────
const KEY = 'dosetti_v2';

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}

function save(s) { localStorage.setItem(KEY, JSON.stringify(s)); }

function calcStreak(state) {
  let streak = 0;
  const d = new Date();
  if (!state[todayKey()]) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 3650; i++) {
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (state[k]) { streak++; d.setDate(d.getDate() - 1); } else break;
  }
  return streak;
}

// ── UI ────────────────────────────────────────────────────────────────────────
function updateUI() {
  const state = load();
  const t = todayKey();
  const taken = !!state[t];

  document.getElementById('doseBtn').className      = 'dose-btn ' + (taken ? 'taken' : 'not-taken');
  document.getElementById('btnIcon').textContent    = taken ? '✓' : '💊';
  document.getElementById('btnText').textContent    = taken ? 'Otettu tänään' : 'Merkitse otetuksi';
  document.getElementById('statusDot').className    = 'status-dot ' + (taken ? 'taken' : 'not-taken');
  document.getElementById('statusText').textContent = taken ? 'Lääke otettu tänään' : 'Lääke ottamatta tänään';
  document.getElementById('timeTaken').textContent  = (taken && state[t+'_time'])
    ? `Kuitattu klo ${state[t+'_time']}` : '\u00a0';
  document.getElementById('streakValue').textContent = calcStreak(state);
}

function updateDate() {
  const now = new Date();
  const days   = ['Sunnuntai','Maanantai','Tiistai','Keskiviikko','Torstai','Perjantai','Lauantai'];
  const months = ['tammikuuta','helmikuuta','maaliskuuta','huhtikuuta','toukokuuta','kesäkuuta',
                  'heinäkuuta','elokuuta','syyskuuta','lokakuuta','marraskuuta','joulukuuta'];
  document.getElementById('dayName').textContent     = days[now.getDay()];
  document.getElementById('dateDisplay').textContent = `${now.getDate()}. ${months[now.getMonth()]} ${now.getFullYear()}`;
}

function takeDose() {
  const state = load();
  const t = todayKey();
  if (state[t]) return;
  const now = new Date();
  state[t] = true;
  state[t+'_time'] = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  save(state);
  updateUI();
  launchConfetti();
}

// ── Confetti ──────────────────────────────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = Array.from({length: 90}, () => ({
    x: Math.random() * canvas.width, y: -20,
    w: Math.random() * 9 + 4, h: Math.random() * 4 + 2,
    r: Math.random() * Math.PI * 2, dr: (Math.random() - 0.5) * 0.2,
    vx: (Math.random() - 0.5) * 4, vy: Math.random() * 4 + 2,
    color: ['#00d68f','#4ec3ff','#ffd700','#ff4b6e','#c3f0ca'][Math.floor(Math.random()*5)],
    alpha: 1,
  }));
  (function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of pieces) {
      p.x += p.vx; p.y += p.vy; p.r += p.dr; p.vy += 0.1; p.alpha -= 0.012;
      if (p.alpha > 0) {
        alive = true;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      }
    }
    if (alive) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  })();
}

// ── Midnight refresh ──────────────────────────────────────────────────────────
function scheduleMidnight() {
  const now = new Date();
  const ms = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1) - now;
  setTimeout(() => { updateDate(); updateUI(); scheduleMidnight(); }, ms);
}

// ── PWA setup ─────────────────────────────────────────────────────────────────
// Chrome/Android vaatii oikeat PNG-ikonit manifest.json:issa.
// Generoidaan ne canvaksella ja injektoidaan Blob URL:nä.
function buildPWA() {
  // Piirrä pilleri-ikoni annettuun kokoon
  function drawIcon(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const s = size;

    // Pyöristetty tausta
    ctx.fillStyle = '#0f0f1a';
    if (ctx.roundRect) {
      ctx.beginPath(); ctx.roundRect(0, 0, s, s, s * 0.22); ctx.fill();
    } else {
      const r = s * 0.22;
      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(s-r, 0);
      ctx.quadraticCurveTo(s, 0, s, r);
      ctx.lineTo(s, s-r); ctx.quadraticCurveTo(s, s, s-r, s);
      ctx.lineTo(r, s);   ctx.quadraticCurveTo(0, s, 0, s-r);
      ctx.lineTo(0, r);   ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath(); ctx.fill();
    }

    // Pillerin taustaellipsi (hehku)
    ctx.fillStyle = 'rgba(78,195,255,0.10)';
    ctx.beginPath();
    ctx.ellipse(s/2, s/2, s*0.37, s*0.22, 0, 0, Math.PI*2);
    ctx.fill();

    // Pilleri – oikea puoli (vaalea sininen)
    const px = s * 0.14, py = s * 0.40, pw = s * 0.72, ph = s * 0.20;
    const pr = ph / 2;
    ctx.fillStyle = '#4ec3ff';
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(px, py, pw, ph, pr);
    } else {
      ctx.moveTo(px + pr, py);
      ctx.lineTo(px + pw - pr, py);
      ctx.quadraticCurveTo(px + pw, py, px + pw, py + pr);
      ctx.lineTo(px + pw, py + ph - pr);
      ctx.quadraticCurveTo(px + pw, py + ph, px + pw - pr, py + ph);
      ctx.lineTo(px + pr, py + ph);
      ctx.quadraticCurveTo(px, py + ph, px, py + ph - pr);
      ctx.lineTo(px, py + pr);
      ctx.quadraticCurveTo(px, py, px + pr, py);
    }
    ctx.fill();

    // Pilleri – vasen puoli (tumma sininen)
    ctx.fillStyle = '#1a6aaa';
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(px, py, pw / 2, ph, pr);
    } else {
      ctx.moveTo(px + pr, py);
      ctx.lineTo(px + pw/2, py);
      ctx.lineTo(px + pw/2, py + ph);
      ctx.lineTo(px + pr, py + ph);
      ctx.quadraticCurveTo(px, py + ph, px, py + ph - pr);
      ctx.lineTo(px, py + pr);
      ctx.quadraticCurveTo(px, py, px + pr, py);
    }
    ctx.fill();

    // Jakoviiva
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(s/2 - 1, py, 2, ph);

    // Koristepisteet
    [[s*0.32, s*0.29],[s*0.68, s*0.71]].forEach(([cx, cy]) => {
      ctx.fillStyle = 'rgba(78,195,255,0.6)';
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.038, 0, Math.PI*2);
      ctx.fill();
    });

    return c.toDataURL('image/png');
  }

  const icon192 = drawIcon(192);
  const icon512 = drawIcon(512);

  // Apple touch icon (iOS)
  const appleLink = document.createElement('link');
  appleLink.rel = 'apple-touch-icon';
  appleLink.href = icon192;
  document.head.appendChild(appleLink);

  // Manifest
  const manifest = {
    name: 'Dosetti',
    short_name: 'Dosetti',
    description: 'Päivittäinen lääkemuistutus',
    start_url: location.href,
    display: 'standalone',
    background_color: '#0f0f1a',
    theme_color: '#0f0f1a',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
    ],
  };

  const mBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const mURL  = URL.createObjectURL(mBlob);
  const mLink = document.createElement('link');
  mLink.rel  = 'manifest';
  mLink.href = mURL;
  document.head.appendChild(mLink);

  // Service Worker (tarvitaan PWA-asennusvaatimuksiin)
  if ('serviceWorker' in navigator) {
    const swSrc = `
self.addEventListener('install',  () => self.skipWaiting());
self.addEventListener('activate', () => clients.claim());
self.addEventListener('fetch', e => e.respondWith(
  fetch(e.request).catch(() => new Response('', { status: 200 }))
));`;
    const swBlob = new Blob([swSrc], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob))
      .catch(e => console.warn('SW:', e));
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
updateDate();
updateUI();
scheduleMidnight();
buildPWA();
</script>
</body>
</html>
