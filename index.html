  <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjQ4IiBmaWxsPSIjMWExYTJlIi8+PGVsbGlwc2UgY3g9Ijk2IiBjeT0iOTYiIHJ4PSI1MCIgcnk9IjMwIiBmaWxsPSIjNGVjM2ZmIiBvcGFjaXR5PSIwLjIiLz48cmVjdCB4PSI0NiIgeT0iODMiIHdpZHRoPSIxMDAiIGhlaWdodD0iMjYiIHJ4PSIxMyIgZmlsbD0iIzRlYzNmZiIvPjxyZWN0IHg9IjQ2IiB5PSI4MyIgd2lkdGg9IjUwIiBoZWlnaHQ9IjI2IiByeD0iMTMiIGZpbGw9IiMxZTkwZmYiLz48Y2lyY2xlIGN4PSI3MSIgY3k9IjYwIiByPSI1IiBmaWxsPSIjNGVjM2ZmIiBvcGFjaXR5PSIwLjYiLz48Y2lyY2xlIGN4PSIxMjEiIGN5PSIxMzIiIHI9IjUiIGZpbGw9IiM0ZWMzZmYiIG9wYWNpdHk9IjAuNiIvPjwvc3ZnPg==">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --bg:       #0f0f1a;
      --surface:  #1a1a2e;
      --border:   rgba(78,195,255,0.15);
      --text:     #e8eaf0;
      --muted:    #7a8099;
      --accent:   #4ec3ff;
      --red:      #ff4b6e;
      --green:    #00d68f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      overflow: hidden;
    }

    /* Starfield bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 15%, rgba(78,195,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 30%, rgba(78,195,255,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 70%, rgba(78,195,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 65%, rgba(78,195,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 85%, rgba(78,195,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 90%, rgba(78,195,255,0.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 65% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,0.2) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(78,195,255,0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(78,195,255,0.05),
        0 24px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .pill-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #e8eaf0 0%, #4ec3ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .date-display {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .day-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 2rem;
      letter-spacing: -0.01em;
    }

    /* The main button */
    .dose-btn {
      position: relative;
      width: 100%;
      padding: 1.1rem 1.5rem;
      border: none;
      border-radius: 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.25s ease, background 0.4s ease;
      overflow: hidden;
      outline: none;
    }

    .dose-btn:active { transform: scale(0.97); }

    .dose-btn.not-taken {
      background: linear-gradient(135deg, #ff4b6e, #c0213f);
      color: #fff;
      box-shadow: 0 8px 32px rgba(255,75,110,0.45), 0 2px 8px rgba(0,0,0,0.3);
    }

    .dose-btn.not-taken:hover {
      box-shadow: 0 10px 40px rgba(255,75,110,0.6), 0 2px 8px rgba(0,0,0,0.3);
      transform: translateY(-1px);
    }

    .dose-btn.taken {
      background: linear-gradient(135deg, #00d68f, #00a86b);
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,214,143,0.4), 0 2px 8px rgba(0,0,0,0.3);
      cursor: default;
    }

    /* Pulse ring on not-taken */
    .dose-btn.not-taken::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15);
      animation: pulse-ring 2.5s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.015); }
    }

    .btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .btn-icon {
      font-size: 1.3rem;
      line-height: 1;
    }

    .status-row {
      margin-top: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s;
    }

    .status-dot.taken { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.not-taken { background: var(--red); box-shadow: 0 0 6px var(--red); }

    .streak {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .streak-label {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .streak-value {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      line-height: 1;
      color: var(--accent);
    }

    .streak-unit {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    /* Time taken badge */
    .time-taken {
      display: none;
      margin-top: 0.8rem;
      font-size: 0.78rem;
      color: var(--green);
      letter-spacing: 0.04em;
    }
    .time-taken.visible { display: block; }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="card">
  <!-- Pill SVG icon -->
  <svg class="pill-icon" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="36" cy="36" rx="24" ry="14" fill="rgba(78,195,255,0.1)" />
    <rect x="12" y="29" width="48" height="14" rx="7" fill="#4ec3ff" id="pill-right"/>
    <rect x="12" y="29" width="24" height="14" rx="7" fill="#1e7ebf" id="pill-left"/>
    <circle cx="25" cy="24" r="2.5" fill="#4ec3ff" opacity="0.5"/>
    <circle cx="47" cy="48" r="2.5" fill="#4ec3ff" opacity="0.5"/>
    <circle cx="54" cy="26" r="1.5" fill="#4ec3ff" opacity="0.35"/>
  </svg>

  <h1>Dosetti</h1>
  <div class="subtitle">Päivittäinen lääkemuistutus</div>

  <div class="date-display" id="dateDisplay"></div>
  <div class="day-name" id="dayName"></div>

  <button class="dose-btn not-taken" id="doseBtn" onclick="toggleDose()">
    <div class="btn-inner">
      <span class="btn-icon" id="btnIcon">💊</span>
      <span id="btnText">Merkitse otetuksi</span>
    </div>
  </button>

  <div class="time-taken" id="timeTaken"></div>

  <div class="status-row">
    <div class="status-dot not-taken" id="statusDot"></div>
    <span id="statusText">Lääke ottamatta tänään</span>
  </div>

  <div class="streak">
    <div class="streak-label">Peräkkäinen putki</div>
    <div class="streak-value" id="streakValue">0</div>
    <div class="streak-unit">päivää peräkkäin</div>
  </div>
</div>

<script>
  // ── State ────────────────────────────────────────────────
  const STORAGE_KEY = 'dosetti_v1';

  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function saveState(s) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  }

  function calcStreak(state) {
    let streak = 0;
    const d = new Date();
    // Start from yesterday if today not taken, from today if taken
    if (!state[today()]) { d.setDate(d.getDate() - 1); }
    while (true) {
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (state[key]) { streak++; d.setDate(d.getDate()-1); }
      else break;
    }
    return streak;
  }

  // ── UI update ─────────────────────────────────────────────
  function updateUI() {
    const state = loadState();
    const t = today();
    const taken = !!state[t];

    const btn = document.getElementById('doseBtn');
    const icon = document.getElementById('btnIcon');
    const txt  = document.getElementById('btnText');
    const dot  = document.getElementById('statusDot');
    const stxt = document.getElementById('statusText');
    const timeTaken = document.getElementById('timeTaken');
    const streakEl = document.getElementById('streakValue');

    if (taken) {
      btn.className = 'dose-btn taken';
      icon.textContent = '✓';
      txt.textContent = 'Otettu tänään';
      dot.className = 'status-dot taken';
      stxt.textContent = 'Lääke otettu tänään';
      if (state[t + '_time']) {
        timeTaken.textContent = `Kuitattu klo ${state[t + '_time']}`;
        timeTaken.classList.add('visible');
      }
    } else {
      btn.className = 'dose-btn not-taken';
      icon.textContent = '💊';
      txt.textContent = 'Merkitse otetuksi';
      dot.className = 'status-dot not-taken';
      stxt.textContent = 'Lääke ottamatta tänään';
      timeTaken.classList.remove('visible');
    }

    streakEl.textContent = calcStreak(state);
  }

  function updateDate() {
    const now = new Date();
    const days = ['Sunnuntai','Maanantai','Tiistai','Keskiviikko','Torstai','Perjantai','Lauantai'];
    const months = ['tammikuuta','helmikuuta','maaliskuuta','huhtikuuta','toukokuuta','kesäkuuta',
                    'heinäkuuta','elokuuta','syyskuuta','lokakuuta','marraskuuta','joulukuuta'];
    document.getElementById('dayName').textContent = days[now.getDay()];
    document.getElementById('dateDisplay').textContent =
      `${now.getDate()}. ${months[now.getMonth()]} ${now.getFullYear()}`;
  }

  // ── Toggle ────────────────────────────────────────────────
  function toggleDose() {
    const state = loadState();
    const t = today();
    if (state[t]) return; // already taken, no toggle back

    const now = new Date();
    state[t] = true;
    state[t + '_time'] = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    saveState(state);
    updateUI();
    launchConfetti();
  }

  // ── Confetti ──────────────────────────────────────────────
  function launchConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const pieces = Array.from({length: 80}, () => ({
      x: Math.random() * canvas.width,
      y: -20,
      w: Math.random() * 8 + 4,
      h: Math.random() * 4 + 2,
      r: Math.random() * Math.PI * 2,
      dr: (Math.random() - 0.5) * 0.2,
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 4 + 2,
      color: ['#00d68f','#4ec3ff','#ffd700','#ff4b6e','#c3f0ca'][Math.floor(Math.random()*5)],
      alpha: 1,
    }));

    let frame;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      for (const p of pieces) {
        p.x += p.vx; p.y += p.vy; p.r += p.dr;
        p.vy += 0.1; p.alpha -= 0.012;
        if (p.alpha > 0) {
          alive = true;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.r);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
          ctx.restore();
        }
      }
      if (alive) { frame = requestAnimationFrame(draw); }
      else { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    }
    cancelAnimationFrame(frame);
    draw();
  }

  // ── Init ──────────────────────────────────────────────────
  updateDate();
  updateUI();

  // Refresh at midnight
  function scheduleRefresh() {
    const now = new Date();
    const ms = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1) - now;
    setTimeout(() => { updateDate(); updateUI(); scheduleRefresh(); }, ms);
  }
  scheduleRefresh();

  // Service worker for installability
  if ('serviceWorker' in navigator) {
    const sw = `
self.addEventListener('install', e => self.skipWaiting());
self.addEventListener('activate', e => clients.claim());
self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response(''))));
`;
    const blob = new Blob([sw], {type: 'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }
</script>
</body>
</html>
